<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f0"/>
      <stop offset="1" stop-color="#ebe4d3"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbb6e"/>
      <stop offset="1" stop-color="#5d8547"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f9a55"/>
      <stop offset="1" stop-color="#4b6b3a"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2a2418" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2f4424" flood-opacity="0.22"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- Tile: warm paper, the app's own background -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#paper)" filter="url(#drop)"/>
  <g clip-path="url(#tile)">
    <ellipse cx="512" cy="1010" rx="520" ry="210" fill="#e2d9c3" opacity="0.55"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#d8cfbb" stroke-width="3"/>

  <!-- The twig: one stem rising left to right, a side shoot, leaves, a bud -->
  <g filter="url(#soft)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M262 760 C 380 700, 470 600, 560 470 S 700 290, 770 250" stroke="#3f5b30" stroke-width="34"/>
    <path d="M520 525 C 470 470, 450 410, 455 350" stroke="#3f5b30" stroke-width="24"/>
  </g>
  <g filter="url(#soft)">
    <!-- leaf on the side shoot -->
    <path d="M455 352 C 395 330, 360 270, 372 205 C 438 222, 478 283, 455 352 Z" fill="url(#leafA)"/>
    <path d="M455 350 C 430 305, 405 262, 376 212" stroke="#3f5b30" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- low leaf, hanging right -->
    <path d="M410 660 C 350 690, 275 680, 232 628 C 290 590, 370 605, 410 660 Z" fill="url(#leafB)"/>
    <path d="M408 658 C 350 640, 290 630, 240 630" stroke="#2f4424" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- high leaf, reaching up -->
    <path d="M606 418 C 660 470, 740 480, 800 445 C 755 385, 665 375, 606 418 Z" fill="url(#leafB)"/>
    <path d="M610 420 C 670 432, 735 440, 792 444" stroke="#2f4424" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.5"/>
    <!-- bud at the tip -->
    <circle cx="776" cy="246" r="30" fill="#8fbb6e"/>
    <circle cx="768" cy="238" r="10" fill="#c9e0b4" opacity="0.8"/>
  </g>
</svg>
